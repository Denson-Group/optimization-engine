[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denson-optimization-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["optuna==4.6.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
