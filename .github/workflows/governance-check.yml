name: Governance Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify required governance files
        shell: bash
        run: |
          test -f AGENTS.md
          test -f governance/MASTER_PROJECT_CONTEXT.md
          test -f governance/INTEGRATION_VERSIONS.yaml
          git submodule status governance

